# Google Cloud Build CI/CD Pipeline
# Automated build, test, and deployment for RAG Medical Assistant

steps:
  # Step 1: Install dependencies and run tests
  - name: 'node:18-alpine'
    entrypoint: 'npm'
    args: ['ci']
    id: 'install-deps'

  # Step 2: Run frontend tests
  - name: 'node:18-alpine'
    entrypoint: 'npm'
    args: ['run', 'test:ci']
    id: 'run-tests'
    waitFor: ['install-deps']

  # Step 3: Run TypeScript type checking
  - name: 'node:18-alpine'
    entrypoint: 'npm'
    args: ['run', 'type-check']
    id: 'type-check'
    waitFor: ['install-deps']

  # Step 4: Run linting
  - name: 'node:18-alpine'
    entrypoint: 'npm'
    args: ['run', 'lint']
    id: 'lint'
    waitFor: ['install-deps']

  # Step 5: Security scan with npm audit
  - name: 'node:18-alpine'
    entrypoint: 'npm'
    args: ['audit', '--audit-level', 'moderate']
    id: 'security-scan'
    waitFor: ['install-deps']

  # Step 6: Build the application
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-f', 'Dockerfile.gcp',
      '-t', 'gcr.io/$PROJECT_ID/rag-medical-assistant:$COMMIT_SHA',
      '-t', 'gcr.io/$PROJECT_ID/rag-medical-assistant:latest',
      '.'
    ]
    id: 'build-image'
    waitFor: ['run-tests', 'type-check', 'lint', 'security-scan']

  # Step 7: Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/rag-medical-assistant:$COMMIT_SHA']
    id: 'push-image-sha'
    waitFor: ['build-image']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/rag-medical-assistant:latest']
    id: 'push-image-latest'
    waitFor: ['build-image']

  # Step 8: Container security scanning
  - name: 'gcr.io/cloud-builders/gcloud'
    args: [
      'container', 'images', 'scan',
      'gcr.io/$PROJECT_ID/rag-medical-assistant:$COMMIT_SHA',
      '--format=json'
    ]
    id: 'container-scan'
    waitFor: ['push-image-sha']

  # Step 9: Deploy to Cloud Run (staging)
  - name: 'gcr.io/cloud-builders/gcloud'
    args: [
      'run', 'deploy', 'rag-medical-assistant-staging',
      '--image', 'gcr.io/$PROJECT_ID/rag-medical-assistant:$COMMIT_SHA',
      '--region', '${_REGION}',
      '--platform', 'managed',
      '--allow-unauthenticated',
      '--memory', '4Gi',
      '--cpu', '2',
      '--concurrency', '80',
      '--max-instances', '10',
      '--set-env-vars', 'NODE_ENV=staging,FLASK_ENV=staging',
      '--service-account', 'rag-medical-sa@$PROJECT_ID.iam.gserviceaccount.com'
    ]
    id: 'deploy-staging'
    waitFor: ['container-scan']

  # Step 10: Run integration tests against staging
  - name: 'node:18-alpine'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Get staging URL
        STAGING_URL=$(gcloud run services describe rag-medical-assistant-staging --region=${_REGION} --format="value(status.url)")
        
        # Install test dependencies
        npm install -g newman
        
        # Run API tests
        newman run tests/postman/api-tests.json --env-var "base_url=$$STAGING_URL"
        
        # Run health checks
        curl -f "$$STAGING_URL/health" || exit 1
        curl -f "$$STAGING_URL/api/health" || exit 1
    id: 'integration-tests'
    waitFor: ['deploy-staging']

  # Step 11: Deploy to production (only on main branch)
  - name: 'gcr.io/cloud-builders/gcloud'
    args: [
      'run', 'deploy', 'rag-medical-assistant',
      '--image', 'gcr.io/$PROJECT_ID/rag-medical-assistant:$COMMIT_SHA',
      '--region', '${_REGION}',
      '--platform', 'managed',
      '--allow-unauthenticated',
      '--memory', '4Gi',
      '--cpu', '2',
      '--concurrency', '80',
      '--max-instances', '100',
      '--min-instances', '1',
      '--set-env-vars', 'NODE_ENV=production,FLASK_ENV=production',
      '--service-account', 'rag-medical-sa@$PROJECT_ID.iam.gserviceaccount.com',
      '--vpc-connector', 'projects/$PROJECT_ID/locations/${_REGION}/connectors/rag-connector',
      '--vpc-egress', 'private-ranges-only'
    ]
    id: 'deploy-production'
    waitFor: ['integration-tests']

  # Step 12: Update traffic to new revision (gradual rollout)
  - name: 'gcr.io/cloud-builders/gcloud'
    args: [
      'run', 'services', 'update-traffic', 'rag-medical-assistant',
      '--region', '${_REGION}',
      '--to-revisions', 'LATEST=10',
      '--platform', 'managed'
    ]
    id: 'gradual-rollout'
    waitFor: ['deploy-production']

  # Step 13: Post-deployment verification
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Get production URL
        PROD_URL=$(gcloud run services describe rag-medical-assistant --region=${_REGION} --format="value(status.url)")
        
        # Verify deployment
        echo "🔍 Verifying production deployment..."
        curl -f "$$PROD_URL/health" || exit 1
        
        # Send notification
        echo "✅ Deployment successful: $$PROD_URL"
    id: 'verify-deployment'
    waitFor: ['gradual-rollout']

# Substitution variables
substitutions:
  _REGION: 'us-central1'

# Build configuration
options:
  # Use high-performance machine for faster builds
  machineType: 'E2_HIGHCPU_8'
  
  # Enable logging
  logging: CLOUD_LOGGING_ONLY
  
  # Set build timeout
  timeout: '1200s'

# Build triggers
# This file should be used with Cloud Build triggers configured for:
# - Push to main branch (production deployment)
# - Pull requests (staging deployment only)
# - Manual triggers (full pipeline)

# Environment-specific configurations
availableSecrets:
  secretManager:
  - versionName: projects/$PROJECT_ID/secrets/openai-api-key/versions/latest
    env: 'OPENAI_API_KEY'
  - versionName: projects/$PROJECT_ID/secrets/database-url/versions/latest
    env: 'DATABASE_URL'
  - versionName: projects/$PROJECT_ID/secrets/redis-url/versions/latest
    env: 'REDIS_URL'
  - versionName: projects/$PROJECT_ID/secrets/jwt-secret/versions/latest
    env: 'JWT_SECRET'