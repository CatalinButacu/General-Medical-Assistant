name: Deploy backend to HuggingFace Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  push-to-hf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (full history; HF rejects shallow pushes)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Configure git identity for the HF push
        run: |
          git config user.email "ci@github.actions"
          git config user.name "GitHub Actions"

      - name: Push to HuggingFace Space repo
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          HF_SPACE: ${{ secrets.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_USERNAME" ] || [ -z "$HF_SPACE" ]; then
            echo "::error::Missing HF_TOKEN / HF_USERNAME / HF_SPACE secrets."
            exit 1
          fi
          # Force-push: HF Space repo is treated as a deploy target,
          # not a development branch. History on HF mirrors GH main.
          git push --force \
            "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE}" \
            HEAD:main
