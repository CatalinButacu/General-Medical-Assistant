name: Deploy backend to HuggingFace Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  push-to-hf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure git identity for the HF push
        run: |
          git config user.email "ci@github.actions"
          git config user.name "GitHub Actions"

      - name: Build deploy snapshot (orphan commit, drop binary corpus inputs)
        run: |
          # HF Spaces' Xet storage rejects all binary blobs on push
          # (regardless of size) unless tracked via LFS. The Dockerfile
          # fetches these two files from the public GitHub repo at
          # build time, so we just remove them from the snapshot.
          rm -f data_acquisition/raw/anmdm_nomenclator.xlsx
          rm -f data_acquisition/processed/pdf_links.json
          rm -f data_acquisition/processed/pdf_links.json.gz
          # Single-commit deploy history also keeps the HF Space repo
          # small and free of any historical large/binary blobs.
          git checkout --orphan hf-deploy
          git add -A
          git commit -m "Med Assist deploy ${{ github.sha }}"

      - name: Push deploy snapshot to HuggingFace Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          HF_SPACE: ${{ secrets.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_USERNAME" ] || [ -z "$HF_SPACE" ]; then
            echo "::error::Missing HF_TOKEN / HF_USERNAME / HF_SPACE secrets."
            exit 1
          fi
          git push --force \
            "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE}" \
            hf-deploy:main
