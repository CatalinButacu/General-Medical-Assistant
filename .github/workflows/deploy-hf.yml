name: Deploy backend to HuggingFace Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  push-to-hf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure git identity for the HF push
        run: |
          git config user.email "ci@github.actions"
          git config user.name "GitHub Actions"

      - name: Build deploy snapshot (orphan commit, gzip blobs > 10 MiB)
        run: |
          # HF Spaces rejects any non-LFS blob > 10 MiB on push.
          # pdf_links.json is 11 MB -> compress it (~1-2 MB after gzip);
          # the Dockerfile decompresses it during the build stage.
          gzip -9 data_acquisition/processed/pdf_links.json
          # Single-commit deploy history avoids shipping the 11 MB blob
          # that exists in main's history (the hook checks all new objects,
          # not just the tip), and keeps the HF Space repo small.
          git checkout --orphan hf-deploy
          git add -A
          git commit -m "Med Assist deploy ${{ github.sha }}"

      - name: Push deploy snapshot to HuggingFace Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          HF_SPACE: ${{ secrets.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_USERNAME" ] || [ -z "$HF_SPACE" ]; then
            echo "::error::Missing HF_TOKEN / HF_USERNAME / HF_SPACE secrets."
            exit 1
          fi
          git push --force \
            "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE}" \
            hf-deploy:main
