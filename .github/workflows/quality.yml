name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (lint + typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run check

  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install backend deps
        run: |
          pip install --upgrade pip
          pip install ruff pytest httpx
          pip install fastapi uvicorn pydantic python-dotenv numpy jinja2 google-genai
          pip install "SQLAlchemy>=2.0" "pyjwt[crypto]>=2.8"
      - name: Ruff
        run: ruff check med_assist/ data_acquisition/scripts/
      - name: Pytest
        run: pytest med_assist/tests/ -q --no-header
