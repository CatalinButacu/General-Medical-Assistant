<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Med Assist · demo offline</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a232c;
      --border: #2a3744;
      --text: #d6e0ea;
      --muted: #8a9bab;
      --accent: #4cc9f0;
      --emergency: #ef4444;
      --otc: #22c55e;
      --uncertain: #f59e0b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.5;
    }
    main { max-width: 820px; margin: 0 auto; padding: 24px; }
    h1 { font-size: 22px; margin: 0 0 4px; color: var(--accent); }
    .sub { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
    form { display: flex; gap: 8px; margin-bottom: 16px; }
    input[type=text] {
      flex: 1; padding: 12px 14px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--panel); color: var(--text);
      font-size: 15px;
    }
    input[type=text]:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
    button {
      padding: 12px 18px; border-radius: 8px; border: none;
      background: var(--accent); color: #001018; font-weight: 600; cursor: pointer; font-size: 14px;
    }
    button:disabled { opacity: 0.5; cursor: wait; }
    .examples { margin-bottom: 24px; display: flex; flex-wrap: wrap; gap: 6px; }
    .examples button {
      background: var(--panel); border: 1px solid var(--border); color: var(--muted); padding: 6px 10px;
      font-size: 12px; font-weight: normal;
    }
    .label {
      display: inline-block; padding: 4px 10px; border-radius: 4px;
      font-size: 12px; font-weight: 600; letter-spacing: 0.5px;
    }
    .label.EMERGENCY { background: var(--emergency); color: white; }
    .label.OTC_SAFE { background: var(--otc); color: #002010; }
    .label.UNCERTAIN { background: var(--uncertain); color: #1a1000; }
    .panel {
      background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
      padding: 16px; margin-bottom: 12px;
    }
    .panel.emergency { border-color: var(--emergency); background: rgba(239,68,68,0.08); }
    .meta { color: var(--muted); font-size: 12px; }
    .action { font-size: 16px; font-weight: 600; margin-top: 8px; }
    .rationale { color: var(--muted); font-size: 13px; margin-top: 8px; font-style: italic; }
    .red-flag { background: rgba(239,68,68,0.12); border-left: 3px solid var(--emergency); padding: 8px 12px; margin: 8px 0; font-size: 13px; }
    .med { padding: 12px; border-bottom: 1px solid var(--border); }
    .med:last-child { border-bottom: none; }
    .med-name { font-weight: 600; }
    .med-name a { color: var(--accent); text-decoration: none; }
    .med-name a:hover { text-decoration: underline; }
    .med-meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .badge {
      display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 11px;
      background: var(--border); color: var(--muted); margin-left: 4px;
    }
    .snippet { font-size: 13px; color: var(--muted); margin-top: 6px; line-height: 1.4; }
    .symptoms { font-size: 12px; color: var(--accent); margin-top: 4px; }
    .links { font-size: 12px; margin-top: 4px; }
    .links a { color: var(--muted); text-decoration: none; margin-right: 12px; }
    .links a:hover { color: var(--accent); }
    .latency { float: right; font-family: ui-monospace, monospace; font-size: 11px; color: var(--muted); }
    .footer { margin-top: 32px; color: var(--muted); font-size: 11px; text-align: center; }
    .footer code { background: var(--panel); padding: 1px 6px; border-radius: 3px; }
  </style>
</head>
<body>
<main>
  <h1>Med Assist · demo offline</h1>
  <div class="sub">RAG triage peste nomenclatorul ANMDM. <strong>Demo educativ — nu este sfat medical.</strong></div>

  <form id="queryForm" autocomplete="off">
    <input type="text" id="q" placeholder="Descrie simptomele, ex: «mă doare burta și am diaree»" required>
    <button type="submit" id="submitBtn">Caută</button>
  </form>

  <div class="examples">
    <button type="button" data-q="mă doare burta și am diaree">diaree</button>
    <button type="button" data-q="tuse productivă cu secreții">tuse productivă</button>
    <button type="button" data-q="nas înfundat">nas înfundat</button>
    <button type="button" data-q="alergie cu mâncărime">alergie</button>
    <button type="button" data-q="arsuri la stomac">arsuri stomac</button>
    <button type="button" data-q="Nurofen">brand: Nurofen</button>
    <button type="button" data-q="am dureri în piept care iradiază în brațul stâng și transpir">⚠ infarct</button>
    <button type="button" data-q="mă doare capul, am febră, și gâtul îmi este înțepenit">⚠ meningită</button>
    <button type="button" data-q="vreau să-mi pun capăt zilelor">⚠ suicidal</button>
  </div>

  <div id="result"></div>

  <div class="footer">
    POST /advise · index <code id="manifestInfo">…</code>
  </div>
</main>

<script>
const $q = document.getElementById('q');
const $form = document.getElementById('queryForm');
const $btn = document.getElementById('submitBtn');
const $result = document.getElementById('result');
const $manifest = document.getElementById('manifestInfo');

function escape(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function loadManifest() {
  try {
    const r = await fetch('/manifest');
    const m = await r.json();
    $manifest.textContent = `${m.chunk_count.toLocaleString()} chunks · ${m.medicine_count.toLocaleString()} medicines · ${m.model.split('/').pop()}`;
  } catch (e) { $manifest.textContent = 'manifest unavailable'; }
}
loadManifest();

document.querySelectorAll('.examples button').forEach(b => {
  b.addEventListener('click', () => { $q.value = b.dataset.q; $form.requestSubmit(); });
});

$form.addEventListener('submit', async e => {
  e.preventDefault();
  const query = $q.value.trim();
  if (!query) return;
  $btn.disabled = true; $btn.textContent = 'caut…';
  $result.innerHTML = '';
  try {
    const r = await fetch('/advise', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({query, top_k: 5, otc_only: true}),
    });
    if (!r.ok) throw new Error(await r.text());
    render(await r.json());
  } catch (err) {
    $result.innerHTML = `<div class="panel" style="color:var(--emergency)">Eroare: ${escape(err.message)}</div>`;
  } finally {
    $btn.disabled = false; $btn.textContent = 'Caută';
  }
});

function render(d) {
  const isEmerg = d.label === 'EMERGENCY';
  let html = `<div class="panel ${isEmerg ? 'emergency' : ''}">`;
  html += `<span class="latency">${d.latency_ms} ms</span>`;
  html += `<span class="label ${d.label}">${d.label}</span>`;
  if (d.confidence) html += ` <span class="meta">confidence ${d.confidence.toFixed(2)}</span>`;
  if (d.recommended_action_ro) html += `<div class="action">${escape(d.recommended_action_ro)}</div>`;
  if (d.rationale) html += `<div class="rationale">${escape(d.rationale)}</div>`;
  for (const rf of d.red_flags) {
    html += `<div class="red-flag"><strong>[${rf.severity}]</strong> ${escape(rf.description)}<br><span class="meta">a apărut «${escape(rf.matched_pattern)}»</span></div>`;
  }
  html += '</div>';

  if (d.medicines.length) {
    html += '<div class="panel"><strong>Medicamente recomandate</strong>';
    for (const m of d.medicines) {
      html += '<div class="med">';
      html += `<div class="med-name">${escape(m.trade_name)} <span class="badge">${m.rx_status}</span><span class="latency">${m.score.toFixed(4)}</span></div>`;
      html += `<div class="med-meta">${escape(m.dci)} · ${escape(m.atc_code)} · ${escape(m.form.toLowerCase())} ${escape(m.concentration)}</div>`;
      if (m.category) html += `<div class="med-meta">${escape(m.category)}</div>`;
      if (m.lay_symptoms.length) html += `<div class="symptoms">pentru: ${m.lay_symptoms.map(escape).join(', ')}</div>`;
      if (m.best_chunk_snippet) html += `<div class="snippet"><em>[${m.best_chunk_type}]</em> ${escape(m.best_chunk_snippet)}…</div>`;
      const links = [];
      if (m.prospect_url) links.push(`<a href="${escape(m.prospect_url)}" target="_blank">prospect ANMDM</a>`);
      if (m.rcp_url) links.push(`<a href="${escape(m.rcp_url)}" target="_blank">RCP</a>`);
      if (links.length) html += `<div class="links">${links.join('')}</div>`;
      html += '</div>';
    }
    html += '</div>';
  }
  $result.innerHTML = html;
}
</script>
</body>
</html>
